<!DOCTYPE html>
<html lang="pt-BR">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fiscal Analytic</title>

    <link rel="stylesheet" href="style.css">

    </head>

    <body>

    <header>
        <h1>Fiscal Analytic</h1>
        <p>Sistema de Gestão de Folha de Pagamento</p>
    
    </header>


    <main>

        <h2>Visão geral</h2>

        <div class="cards">

        <div class="card">
            <p>Funcionários</p>
            <h3>0</h3>
            <span>cadastrados</span>

      </div>

     <div class="card">

        <p>Folha bruta</p>
        <h3>R$ 0,00</h3>
        <span>Valor total</span>
    
    </div>

    <div class="card">

        <p>Processadas</p>
        <h3>0</h3>
        <span>folhas processadas</span>

    </div>

    <div class="card">

        <p>Pendentes</p>
        <h3>0</h3>
        <span>folhas pendentes</span>

    </div>

    </div>

    <section class="cadastro">
    

    <h2>Cadastrar funcionário</h2>

    <form id="formFuncionario">

        <div class="campos">

        <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome">
        </div>

        <div class="campo">
            <label for="cargo">Cargo</label>
            <input type="text" id="cargo">
        </div>

        <div class="campo">
            <label for="salario">Salário base</label>
            <input type="number" id="salario">

        </div>

    </div>

        <button type="submit">Cadastrar funcionário</button>

     </form>

    </section> 

</main>


    <script src="script.js"></script>

    </body>

    </html>
